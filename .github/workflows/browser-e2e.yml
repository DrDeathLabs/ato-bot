name: Browser E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_USERNAME: e2e-admin
      E2E_PASSWORD: e2e-ci-password-not-for-production
      E2E_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: cp backend/.env.example backend/.env
      - run: docker compose up -d --build
      - name: Seed disposable administrator
        run: docker compose exec -T backend python seed_admin.py "$E2E_USERNAME" e2e@atobot.local "$E2E_PASSWORD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose logs --no-color > tmp-compose-e2e.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-logs
          path: tmp-compose-e2e.log
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

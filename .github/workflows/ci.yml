name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://atobot:atobot@127.0.0.1:5432/atobot
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
